name: Entwicklungsbasis und lernende Regression

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  todo-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Automatische Hilfe und Regression ausführen
        run: python3 scripts/assist.py
      - name: Maschinenlesbaren Laufbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-regression-report
          path: work/regression/latest.json
          retention-days: 14
          if-no-files-found: warn
