# PROVOWARE BLUEPRINT 1.1 - TOOL_ZENTRALE; NUR PLANUNG.
# Einzige maschinenlesbare Soll-Quelle fuer Codes, virtuelle Dateien und Szenarien.
schema: provoware-blueprint/1.1
state: draft
as_of: "2026-10-25"
source_masterplan: docs/MASTERPLAN_V3_1.txt
target_repository: provoware/TOOL_ZENTRALE
target_base_commit: 6e9f8638f7a7b6334a23d51988d0e3ef9d82a37c
reference_repo: https://github.com/provoware/TOOL_2026_Multi
reference_commit: 096dc03ae362eed8141b0dbc0c8e91ab0b8daa2d

identity:
  product_family: PROVOWARE
  local_workspace: PROVOWARE
  repository_slug: TOOL_ZENTRALE
  tool_id: TOOL_ZENTRALE
  slug_locked: true
  worktree_model: one_integrated_web_application
  git_root: PROVOWARE/TOOL_ZENTRALE/
  relative_paths_only: true
  display_name_independent_of_slug: true
  shared_code_policy: local_shared_contracts_or_separately_versioned_package
  runtime_data_policy: outside_repository

standards:
  code_regex: "^[A-Z][A-Z0-9]{1,7}$"
  code_immutable_after_freeze: true
  reserved_code_reuse: forbidden
  stable_classes:
    S0: technical_identity_or_registry_location
    S1: versioned_contract_or_stable_boundary
    S2: internal_implementation_may_change
  planned_file_states:
    - VIRTUAL
    - RESERVED
    - SCAFFOLDED
    - IMPLEMENTED
    - VERIFIED
    - FROZEN
    - DEPRECATED
  default_file_state: VIRTUAL
  file_state_note: generated_from_git_and_step_evidence_not_manually_maintained
  planned_patch_budgets:
    micro: {characters: 1500, changed_lines: 30, changed_files: 2}
    standard: {characters: 6000, changed_lines: 120, changed_files: 3}
    controlled: {characters: 12000, changed_lines: 250, changed_files: 5}
  accounting: added_plus_removed_unicode_characters_excluding_diff_headers
  file_generation: confirmed_only_or_approved_step
  source_of_truth: this_blueprint
  authoritative_runtime_state: git_and_route_and_version_ledgers
  derived_indexes: [file-impact-index, scenario-coverage, code-map, patch-preview]

layers:
  UI: {root: web_or_feature_public, may_depend_on: [UI, API]}
  API: {root: app/api_or_feature_backend, may_depend_on: [API, SERVICE, CORE]}
  SERVICE: {root: app/features_backend, may_depend_on: [SERVICE, DOMAIN, STORAGE, CORE, PLUGIN]}
  DOMAIN: {root: app/shared_or_feature_backend, may_depend_on: [DOMAIN]}
  STORAGE: {root: app/storage_or_feature_backend, may_depend_on: [STORAGE, DOMAIN, CORE]}
  CORE: {root: app/core, may_depend_on: [CORE, DOMAIN]}
  PLUGIN: {root: app/core_or_feature_backend, may_depend_on: [PLUGIN, DOMAIN, CORE]}
  QA: {root: tests_or_feature_tests, may_depend_on: []}
  GOV: {root: governance, may_depend_on: []}
  TOOL: {root: scripts, may_depend_on: []}

directories:
  - blueprint
  - blueprint/contracts
  - blueprint/scenarios
  - app
  - app/core
  - app/shared
  - app/api
  - app/storage
  - app/storage/migrations
  - app/features
  - app/features/songs
  - app/features/songs/backend
  - app/features/songs/public
  - app/features/songs/tests
  - app/features/songs/help
  - app/features/projects
  - app/features/projects/backend
  - app/features/projects/public
  - app/features/projects/tests
  - app/features/projects/help
  - app/features/plugin_catalog
  - app/features/plugin_catalog/backend
  - app/features/plugin_catalog/public
  - app/features/plugin_catalog/tests
  - app/features/plugin_catalog/help
  - app/features/tasks
  - app/features/tasks/backend
  - app/features/media
  - app/features/media/backend
  - web
  - web/assets
  - web/js
  - web/js/components
  - web/css
  - web/i18n
  - web/help
  - governance
  - docs
  - docs/decisions
  - tests
  - tests/unit
  - tests/api
  - tests/integration
  - tests/architecture
  - tests/e2e
  - tests/security
  - scripts

module_contract:
  module_manifest_key: id
  module_id_stable: true
  executable_external_plugins_v1: false
  public_asset_scope: feature_public_directory_only
  dependency_direction: core_contract_may_be_consumed_by_feature
  reverse_import_from_core_to_feature: forbidden
  cross_feature_direct_import: forbidden_without_versioned_contract
  module_layout: [manifest.yaml, backend, public, tests, help]

modules:
  songs: {root: app/features/songs, id: MOD_SONGS, contract_major: 1, state: PLANNED, min_gate: G5}
  projects: {root: app/features/projects, id: MOD_PROJECTS, contract_major: 1, state: PLANNED, min_gate: G6}
  plugin_catalog: {root: app/features/plugin_catalog, id: MOD_PLUGIN_CATALOG, contract_major: 1, state: PLANNED, min_gate: G8}

