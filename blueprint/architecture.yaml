  plan_documents_on_draft_pr_authorized: true
tool_local_log:
  logical_path: TOOL_ZENTRALE/daten/VERBESSERUNGEN.txt
  physical_policy: user_data_directory_outside_git_and_release
  source_of_truth: append_only_utf8_txt
  record_fields:
  - utc_iso8601
  - app_version
  - build_sha
  - note_id
  - text
  single_physical_line_per_record: true
  max_text_characters_initial: 1000
  append_guards:
  - server_generated_version
  - unique_request_id
  - bounded_input
  - single_writer_lock
  - durable_write_ack
  - partial_tail_detection
  - draft_retained_until_ack
  - backup_inclusion
  - never_log_note_text
  file_opening: in_app_viewer_and_approved_folder_open_action
offline_delivery:
  desired_v1: true
  build_method: pinned_local_wheels_plus_launcher
  target: kubuntu_linux_x86_64_first
  network_at_launch: never_required_after_successful_offline_install
  clean_machine_trial: required_at_G11_before_offline_claim
  no_unattended_admin_install: true
performance_contract:
  reference_hardware_required: true
  first_measurement_gate: G4
  final_budget_review_gate: G10
  metrics:
  - first_actionable_ui_ms
  - first_note_ack_ms
  - project_search_p95_ms
  - module_open_p95_ms
  no_required_background_polling_at_idle: true
  budget_thresholds: calibrate_after_real_prototype_not_invented_now
  regression_policy: compare_same_hardware_toolchain_fixture_before_gate
revision_notes:
  parent_version: '3.1'
  status: draft_pr_candidate_not_approved
  added_source_files_are_virtual: true
  canonical_plan_is_base_plus_delta_until_approved: true
