simulation_policy:
  type: contract_and_graph_dry_run
  no_claim_of_real_execution: true
  required_checks:
  - globally_unique_code_ids
  - code_pattern_and_stable_target
  - all_dependencies_exist
  - acyclic_runtime_dependency_graph
  - no_layer_direction_violation
  - referenced_files_in_catalog
  - all_scenarios_have_one_or_more_tests
  - denied_capabilities_default_closed
  - negative_scenarios_defined
  - fixed_slug_of_existing_repository
  - same_sha_for_evidence_when_implemented
  approval_threshold:
    missing_codes: 0
    duplicate_paths: 0
    dependency_cycles: 0
    invalid_layer_edges: 0
    missing_scenario_tests: 0
