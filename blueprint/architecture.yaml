# Die Codes bezeichnen Komponenten/Schnittstellen, nicht verkleidete Codezeilen.
# Dependencies bilden erlaubte Laufzeit- / Bauzeit-Verbrauchsrichtungen.
codebook:
  KCFG: {label: Konfiguration, layer: CORE, path: app/core/config.py, requires: []}
  KLOG: {label: Ereignisprotokoll, layer: CORE, path: app/core/logging.py, requires: [KCFG]}
  KERR: {label: Fehlerantworten, layer: CORE, path: app/core/errors.py, requires: [KLOG]}
  KSEC: {label: Rechtepruefung, layer: CORE, path: app/core/security.py, requires: [KCFG]}
  KVER: {label: Versionen, layer: CORE, path: app/core/versions.py, requires: [KCFG]}
  KCAP: {label: Faehigkeitsgrenzen, layer: CORE, path: app/core/capabilities.py, requires: [KCFG]}
  KREG: {label: Modulregistrierung, layer: CORE, path: app/core/module_registry.py, requires: [KCAP]}
  KTXT: {label: Textkatalog, layer: CORE, path: app/core/text_catalog.py, requires: [KCFG]}
  DDOC: {label: Dokumentmodell, layer: DOMAIN, path: app/shared/document.py, requires: []}
  DSNG: {label: Songmodell, layer: DOMAIN, path: app/features/songs/backend/domain.py, requires: [DDOC]}
  DPRJ: {label: Projektmodell, layer: DOMAIN, path: app/features/projects/backend/domain.py, requires: [DDOC]}
  DPLG: {label: Pluginmanifest, layer: DOMAIN, path: app/shared/plugin_manifest.py, requires: []}
  BSQL: {label: SQLite Transaktion, layer: STORAGE, path: app/storage/db.py, requires: [KCFG, KLOG]}
  BSON: {label: Song-Repository, layer: STORAGE, path: app/features/songs/backend/repository.py, requires: [BSQL, DSNG]}
  BPRJ: {label: Projekt-Repository, layer: STORAGE, path: app/features/projects/backend/repository.py, requires: [BSQL, DPRJ]}
  SSNG: {label: Song-Speicherung, layer: SERVICE, path: app/features/songs/backend/service.py, requires: [DSNG, BSON, KLOG]}
  SPSR: {label: Projektsuche, layer: SERVICE, path: app/features/projects/backend/search.py, requires: [DPRJ, BPRJ, KLOG]}
  PLOD: {label: Deklarativer Plugin-Lader, layer: PLUGIN, path: app/core/declarative_loader.py, requires: [DPLG, KREG, KCAP]}
  SPLG: {label: Plugin-Katalog, layer: SERVICE, path: app/features/plugin_catalog/backend/service.py, requires: [PLOD, KLOG]}
  ASNG: {label: Song-API, layer: API, path: app/features/songs/backend/routes.py, requires: [SSNG, KSEC, KERR]}
  APSR: {label: Such-API, layer: API, path: app/features/projects/backend/routes.py, requires: [SPSR, KSEC, KERR]}
  APLG: {label: Plugin-API, layer: API, path: app/features/plugin_catalog/backend/routes.py, requires: [SPLG, KSEC, KERR]}
  UGRD: {label: UI-Raster, layer: UI, path: web/js/components/grid.js, requires: []}
  USNG: {label: Song-Editor, layer: UI, path: app/features/songs/public/editor.js, requires: [UGRD, ASNG]}
  UPSR: {label: Projekt-Suche-UI, layer: UI, path: app/features/projects/public/search.js, requires: [UGRD, APSR]}
  UPLG: {label: Plugin-Katalog-UI, layer: UI, path: app/features/plugin_catalog/public/catalog.js, requires: [UGRD, APLG]}
  TSAV: {label: Song-Speichertest, layer: QA, path: app/features/songs/tests/test_save.py, verifies: [USNG, ASNG, SSNG, BSON, BSQL]}
  TPSR: {label: Projektsuchtest, layer: QA, path: app/features/projects/tests/test_search.py, verifies: [UPSR, APSR, SPSR, BPRJ]}
  TPLG: {label: Plugin-Schutztest, layer: QA, path: app/features/plugin_catalog/tests/test_denial.py, verifies: [UPLG, APLG, SPLG, PLOD, KCAP]}

simulation_policy:
  type: contract_and_graph_dry_run
  no_claim_of_real_execution: true
  required_checks:
    - globally_unique_code_ids
    - code_pattern_and_stable_target
    - all_dependencies_exist
    - acyclic_runtime_dependency_graph
    - no_layer_direction_violation
    - referenced_files_in_catalog
    - all_scenarios_have_one_or_more_tests
    - denied_capabilities_default_closed
    - negative_scenarios_defined
    - fixed_slug_of_existing_repository
    - same_sha_for_evidence_when_implemented
  approval_threshold:
    missing_codes: 0
    duplicate_paths: 0
    dependency_cycles: 0
    invalid_layer_edges: 0
    missing_scenario_tests: 0

ux_traceability:
  source_of_requirements: docs/UX_BARRIEREFREIHEIT.md
  shared_browser_test: tests/e2e/test_accessibility.py
  cases:
    U01: {codes: [USNG], earliest_gate: G5}
    U02: {codes: [UGRD, USNG], earliest_gate: G4}
    U03: {codes: [UGRD, USNG, UPSR], earliest_gate: G4}
    U04: {codes: [UGRD], earliest_gate: G4}
    U05: {codes: [UGRD], earliest_gate: G4}
    U06: {codes: [USNG, UPSR, UPLG], earliest_gate: G4}
    U07: {codes: [USNG, UPSR, UPLG], earliest_gate: G4}
    U08: {codes: [USNG, ASNG, KERR], earliest_gate: G5}
    U09: {codes: [USNG, SSNG, BSON], earliest_gate: G5}
    U10: {codes: [UGRD, UPLG, KREG], earliest_gate: G8}

scenarios:
  song_save:
    objective: create_edit_save_reopen_song_without_silent_loss
    path: [USNG, ASNG, SSNG, BSON, BSQL]
    side_contracts: [DSNG, DDOC]
    guards: [KSEC, KERR, KLOG]
    tests: [TSAV]
    simulation_cases:
      - {id: SNG_POS, input: valid_song, expected: stored_and_reopenable}
      - {id: SNG_INV, input: invalid_song, expected: reject_without_mutation}
      - {id: SNG_REV, input: obsolete_revision, expected: conflict_instead_of_overwrite}
      - {id: SNG_FAIL, input: interrupted_commit, expected: transaction_rollback}
    unresolved_until_real_code: [actual_transaction_rollback, browser_draft_handling]
  project_search:
    objective: scoped_query_with_stable_sort_and_safe_empty_state
    path: [UPSR, APSR, SPSR, BPRJ, BSQL]
    side_contracts: [DPRJ, DDOC]
    guards: [KSEC, KERR, KLOG]
    tests: [TPSR]
    simulation_cases:
      - {id: PRJ_POS, input: scoped_query, expected: matching_sorted_results}
      - {id: PRJ_NOM, input: no_matches, expected: accessible_empty_state}
      - {id: PRJ_XSS, input: malicious_search_text, expected: escaped_display}
      - {id: PRJ_OVR, input: overlarge_query, expected: bounded_validation_error}
    unresolved_until_real_code: [query_performance, actual_data_scoping]
  plugin_load:
    objective: load_declarative_manifest_without_executing_foreign_code
    path: [UPLG, APLG, SPLG, PLOD, KREG, KCAP]
    side_contracts: [DPLG]
    guards: [KSEC, KERR, KLOG]
    tests: [TPLG]
    simulation_cases:
      - {id: PLG_POS, input: trusted_declarative_manifest, expected: metadata_loaded}
      - {id: PLG_CAP, input: unauthorized_capability, expected: denied_without_execution}
      - {id: PLG_ABI, input: incompatible_contract_major, expected: rejected}
      - {id: PLG_EXEC, input: executable_foreign_plugin, expected: rejected_in_v1}
    unresolved_until_real_code: [manifest_parser_exploits, actual_permission_enforcement]

analysis_findings:
  - id: BF-001
    state: resolved_in_blueprint
    problem: domain_contract_wrongly_placed_inside_song_execution_path
    correction: moved_DSNG_DDOC_to_side_contracts
  - id: BF-002
    state: resolved_in_blueprint
    problem: project_model_wrongly_placed_inside_search_execution_path
    correction: moved_DPRJ_DDOC_to_side_contracts
  - id: BF-003
    state: resolved_in_blueprint
    problem: plugin_manifest_wrongly_placed_after_capability_guard_in_linear_path
    correction: moved_DPLG_to_side_contracts

gate_minus_one:
  planning_steps: [B001, B002, B003, B004, B005, B006, B007, B008, B009, B010, B011, B012]
  result_state: planned_not_passed
  must_show:
    - codebook_validity
    - catalog_traceability
    - scenario_completeness
    - open_risks_and_decisions
    - signed_off_slug_and_boundary_contracts
  actual_vertical_slice: deferred_to_authorized_implementation
  no_repository_mutation: true
