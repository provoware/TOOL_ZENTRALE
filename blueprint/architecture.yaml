    may_depend_on:
    - DOMAIN
  STORAGE:
    root: app/storage_or_feature_backend
    may_depend_on:
    - STORAGE
    - DOMAIN
    - CORE
  CORE:
    root: app/core
    may_depend_on:
    - CORE
    - DOMAIN
  PLUGIN:
    root: app/core_or_feature_backend
    may_depend_on:
    - PLUGIN
    - DOMAIN
