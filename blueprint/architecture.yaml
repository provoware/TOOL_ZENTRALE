scenarios:
  song_save:
    objective: create_edit_save_reopen_song_without_silent_loss
    path:
    - USNG
    - ASNG
    - SSNG
    - BSON
    - BSQL
    side_contracts:
    - DSNG
    - DDOC
    guards:
    - KSEC
    - KERR
    - KLOG
    tests:
    - TSAV
    simulation_cases:
    - id: SNG_POS
      input: valid_song
      expected: stored_and_reopenable
    - id: SNG_INV
      input: invalid_song
      expected: reject_without_mutation
    - id: SNG_REV
      input: obsolete_revision
      expected: conflict_instead_of_overwrite
    - id: SNG_FAIL
      input: interrupted_commit
      expected: transaction_rollback
    unresolved_until_real_code:
    - actual_transaction_rollback
    - browser_draft_handling
  project_search:
    objective: scoped_query_with_stable_sort_and_safe_empty_state
    path:
    - UPSR
    - APSR
    - SPSR
    - BPRJ
    - BSQL
    side_contracts:
    - DPRJ
    - DDOC
    guards:
    - KSEC
    - KERR
    - KLOG
    tests:
    - TPSR
    simulation_cases:
    - id: PRJ_POS
      input: scoped_query
      expected: matching_sorted_results
    - id: PRJ_NOM
      input: no_matches
      expected: accessible_empty_state
    - id: PRJ_XSS
      input: malicious_search_text
      expected: escaped_display
    - id: PRJ_OVR
      input: overlarge_query
      expected: bounded_validation_error
    unresolved_until_real_code:
    - query_performance
    - actual_data_scoping
  plugin_load:
    objective: load_declarative_manifest_without_executing_foreign_code
    path:
    - UPLG
    - APLG
    - SPLG
    - PLOD
    - KREG
    - KCAP
    side_contracts:
    - DPLG
    guards:
    - KSEC
    - KERR
    - KLOG
    tests:
    - TPLG
    simulation_cases:
    - id: PLG_POS
      input: trusted_declarative_manifest
      expected: metadata_loaded
    - id: PLG_CAP
      input: unauthorized_capability
      expected: denied_without_execution
    - id: PLG_ABI
      input: incompatible_contract_major
      expected: rejected
    - id: PLG_EXEC
      input: executable_foreign_plugin
      expected: rejected_in_v1
    unresolved_until_real_code:
    - manifest_parser_exploits
    - actual_permission_enforcement
  quick_note_append:
    objective: one_line_note_versioned_append_without_loss
    path:
    - UNOTE
    - ANOTE
    - SNOTE
    - FNOTE
    side_contracts: []
    guards:
    - KSEC
    - KERR
    - KLOG
    - KVER
    tests:
    - TNOTE
    simulation_cases:
    - id: NOTE_OK
      input: valid_one_line
      expected: append_and_reopen
    - id: NOTE_DUP
      input: repeated_request_id
      expected: not_duplicated
    - id: NOTE_DISK
      input: disk_full
      expected: draft_kept_no_false_ack
    - id: NOTE_TAIL
      input: interrupted_append
      expected: partial_tail_detected
    - id: NOTE_VER
      input: version_changed_mid_session
      expected: server_version_stamped
    unresolved_until_real_code:
    - actual_runtime_test_and_evidence
  offline_launch:
    objective: desktop_one_click_and_offline_bootstrap
    path:
    - LBOOT
    side_contracts: []
    guards:
    - KCFG
    - KLOG
    tests:
    - TBOOT
    - TOFF
    simulation_cases:
    - id: BOOT_OK
      input: complete_offline_package
      expected: browser_open_and_health_ok
    - id: BOOT_MISS
      input: missing_wheel
      expected: safe_guided_failure
    - id: BOOT_DBL
      input: double_start
      expected: one_server_reused
    - id: BOOT_PERM
      input: unwritable_data_dir
      expected: no_corruption_clear_help
    unresolved_until_real_code:
    - actual_runtime_test_and_evidence
  import_preview:
    objective: legacy_preview_before_writes
    path:
    - UIMP
    - AIMP
    - SIMP
    - BSQL
    side_contracts: []
    guards:
    - KSEC
    - KERR
    - KLOG
    tests:
    - TIMP
    simulation_cases:
    - id: IMP_OK
      input: valid_legacy_data
      expected: preview_counts_match
    - id: IMP_DUP
      input: conflicting_ids
      expected: visible_collision_list
    - id: IMP_REF
      input: broken_media_reference
      expected: no_hidden_loss
    - id: IMP_FAIL
      input: interrupted_apply
      expected: restore_or_transaction_recovery
    unresolved_until_real_code:
    - actual_runtime_test_and_evidence
  media_open:
    objective: media_open_preview_safely
    path:
    - UMED
    - AMED
    - SMED
    - BSQL
    side_contracts: []
    guards:
    - KSEC
    - KERR
    - KLOG
    tests:
    - TMED
    simulation_cases:
    - id: MED_OK
      input: valid_image_or_audio
      expected: preview_visible
    - id: MED_BAD
      input: corrupt_payload
      expected: safe_error
    - id: MED_PATH
      input: traversal_or_symlink
      expected: denied
    - id: MED_BIG
      input: overlarge_payload
      expected: bounded_rejection
    unresolved_until_real_code:
    - actual_runtime_test_and_evidence
  plugin_trusted_launch:
    objective: only_explicitly_approved_external_process
    path:
    - UPLX
    - APLX
    - SPLX
    - PCMD
    - KCAP
    side_contracts: []
    guards:
    - KSEC
    - KERR
    - KLOG
    tests:
    - TPST
    simulation_cases:
    - id: PLX_OK
      input: allowlisted_local_tool
      expected: approved_process_only
    - id: PLX_CMD
      input: shell_injection_attempt
      expected: denied
    - id: PLX_PERM
      input: unapproved_capability
      expected: denied
    - id: PLX_FREE
      input: arbitrary_python_plugin
      expected: disabled_without_isolation
    unresolved_until_real_code:
    - actual_runtime_test_and_evidence
